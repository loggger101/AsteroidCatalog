[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asteroid-catalog"
version = "0.1.1"
description = "A merged, provenance-tagged catalog of the known asteroids: JPL SBDB, SsODNet, NEOWISE and MP3C cross-matched, validated, and enriched with a cited per-taxonomy composition estimate."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "loggger101" }]
keywords = [
    "asteroid", "astronomy", "planetary-science", "small-bodies",
    "taxonomy", "bus-demeo", "neowise", "ssodnet", "jpl", "catalog",
    "reference-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# pyarrow is NOT optional.  SsODNet's ssoBFT is a ~500 MB parquet read with
# column projection so the ~915-column table is never materialised, and the
# pandas default engine reads the whole thing.  A source that quietly needs
# 20x the memory is worse than one that fails to install.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.28",
    "tqdm>=4.64",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/loggger101/AsteroidCatalog"
Source = "https://github.com/loggger101/AsteroidCatalog"
"Upstream project" = "https://github.com/loggger101/economicspace"

[project.scripts]
asteroid-catalog = "asteroid_catalog.cli:main"

[tool.setuptools]
packages = ["asteroid_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
