name: tests

# NOTHING HERE TOUCHES THE NETWORK OR NEEDS A CATALOG, deliberately.  The whole
# suite is pure: the documented traps run against synthetic frames, and the
# reference export is regenerated into a temp directory.  A test that needed
# 862 MB of input would be a test CI skips, and a skip that fires on every run
# is a check that does not exist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: pytest -q
      - name: The CLI runs without a catalog
        run: |
          asteroid-catalog --version
          asteroid-catalog taxonomy M

  # Unused imports and undefined names only; the rules live in pyproject.toml.
  # The package was sliced out of one module and every slice carried that
  # module's whole import header: 116 dead imports before this ran.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6"
      - run: ruff check
